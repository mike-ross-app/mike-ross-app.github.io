<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Meu dia | Mike Ross</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="mr.css?v=3">
<link rel="icon" href="favicon.png">
<style>
body { margin: 0; padding: 20px 16px 60px; }
.md { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
.md-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px; }
.md-top h1 { margin: 0; font-size: 30px !important; }
.md-top p { margin: 4px 0 0; color: var(--mr-muted); font-size: 13px; }
.md select { font: inherit; font-size: 15px; color: var(--mr-ink); background: var(--mr-surface-2); border: 1px solid var(--mr-line-strong); border-radius: 10px; padding: 9px 12px; }
.md-card { background: var(--mr-surface); border: 1px solid var(--mr-line); border-radius: 14px; padding: 18px; display: grid; gap: 10px; }
.md-card h2 { margin: 0; font: 600 13px var(--mr-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--mr-muted); }
.md-hoje { border-color: var(--mr-teal); background: linear-gradient(160deg, #3a1422 0%, var(--mr-surface) 70%); }
.md-big { font: 600 64px/1 var(--mr-serif); font-variant-numeric: tabular-nums; }
.md-big small { font-size: 22px; color: var(--mr-muted); font-weight: 500; }
.md-frase { font-size: 16px; line-height: 1.4; }
.md-frase b { color: var(--mr-teal); }
.md-ok { color: #7fd3a0 !important; }
.md-bar { height: 10px; border-radius: 5px; background: var(--mr-surface-2); overflow: hidden; }
.md-bar i { display: block; height: 100%; border-radius: 5px; background: var(--mr-teal); }
.md-dois { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.md-mid { font: 600 40px/1 var(--mr-serif); font-variant-numeric: tabular-nums; }
.md-mid small { font-size: 18px; color: var(--mr-muted); }
.md-sub { font-size: 13px; color: var(--mr-muted); }
.md-pos { color: #7fd3a0; } .md-neg { color: #f08a7e; }
.md-lista { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.md-lista li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: 14.5px; }
.md-lista li .md-bar { grid-column: 1 / -1; height: 6px; }
.md-rank li { grid-template-columns: 1.6rem 1fr auto; }
.md-rank li .md-bar { grid-column: 2 / -1; }
.md-rank li.eu { color: var(--mr-teal); font-weight: 600; }
.md-rank .pos { font: 600 18px var(--mr-serif); color: var(--mr-muted); }
.md-tar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.md-tar a { text-decoration: none; color: var(--mr-ink); background: var(--mr-surface-2); border-radius: 10px; padding: 12px; display: grid; gap: 2px; }
.md-tar a b { font: 600 30px/1 var(--mr-serif); }
.md-tar a span { font-size: 12.5px; color: var(--mr-muted); }
.md-aviso { padding: 10px 14px; border-radius: 10px; background: #3a2b12; color: #e9b45e; font-size: 13.5px; }
.md-vazio { color: var(--mr-muted); font-size: 14px; }
[hidden] { display: none !important; }
@media (max-width: 420px) { .md-big { font-size: 54px; } .md-mid { font-size: 34px; } }
</style>
</head>
<body>
<nav class="mr-bar"><div class="mr-lado esq"><span class="mr-grupo">Resultados</span><div class="mr-links"><a aria-current="page" href="meu-dia.html">Meu dia</a><a href="painel.html">Painel</a><a href="tarefas.html">Tarefas</a><a href="tv.html">Modo TV</a></div></div><a class="mr-brand" href="./" aria-label="Início" title="Início"><img src="simbolo.png" alt="Simeão Advogados"></a><div class="mr-lado dir"><span class="mr-grupo">Ferramentas</span><div class="mr-links"><a href="triagem.html">Triagem</a><a href="procuracoes.html">Procurações</a><a href="previdenciario.html">Previdenciário</a><a href="clt.html">CLT</a></div></div></nav>
<main class="md">
  <div class="md-top">
    <div><h1 id="ola">Meu dia</h1><p id="atualizado">Carregando os números do Kommo…</p></div>
    <label><select id="quem" aria-label="Quem é você"></select></label>
  </div>
  <div class="md-aviso" id="aviso" hidden></div>
  <div id="conteudo" hidden>
    <section class="md-card md-hoje" id="c-hoje"></section>
    <div class="md-dois" style="margin-top:14px">
      <section class="md-card" id="c-semana"></section>
      <section class="md-card" id="c-mes"></section>
    </div>
    <section class="md-card" id="c-tarefas" style="margin-top:14px" hidden></section>
    <section class="md-card" id="c-servicos" style="margin-top:14px"></section>
    <section class="md-card" id="c-ranking" style="margin-top:14px"></section>
  </div>
</main>
<script src="motor.js?v=3"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const num = (n) => new Intl.NumberFormat('pt-BR').format(n || 0);
const brl = (n) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(n || 0);
const h = (tag, props, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) { if (v == null || v === false) continue; if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k === 'style') e.style.cssText = v; else e.setAttribute(k, v); }
  for (const k of kids.flat(3)) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
};
const barra = (feito, meta) => h('div', { class: 'md-bar' }, h('i', { style: 'width:' + (meta ? Math.min(100, (feito / meta) * 100) : 0) + '%' }));
const dm = (iso) => iso.slice(8, 10) + '/' + iso.slice(5, 7);
const EQUIPE = 'Equipe toda', CHAVE = 'mr_meu_vendedor';
let painel = null, tarefas = null;
let quem = lerLocal(CHAVE) || '';

const opcoes = [...VENDEDORES, EQUIPE];
$('quem').replaceChildren(new Option('Quem é você?', ''), ...opcoes.map((v) => new Option(v, v)));
$('quem').value = quem;
$('quem').addEventListener('change', () => { quem = $('quem').value; gravarLocal(CHAVE, quem); desenhar(); });

const desenhar = () => {
  if (!painel) return;
  if (!quem) { $('conteudo').hidden = true; $('ola').textContent = 'Meu dia'; $('aviso').hidden = false; $('aviso').textContent = 'Escolha seu nome aqui em cima. O celular lembra da próxima vez.'; return; }
  $('aviso').hidden = true;
  const R = resumoDe(painel, quem);
  if (!R) { $('conteudo').hidden = true; return; }
  $('conteudo').hidden = false;
  const primeiro = quem === EQUIPE ? 'equipe' : quem.split(' ')[0];
  const hr = new Date().getHours();
  $('ola').textContent = (hr < 12 ? 'Bom dia' : hr < 18 ? 'Boa tarde' : 'Boa noite') + ', ' + primeiro;

  // hoje
  const H = $('c-hoje');
  if (!R.util) {
    H.replaceChildren(h('h2', { text: 'Hoje' }), h('div', { class: 'md-big', text: num(R.feitoHoje) }), h('div', { class: 'md-frase', text: 'Hoje não é dia útil. ' + (R.feitoHoje ? 'Mesmo assim, ' + num(R.feitoHoje) + ' ganho(s) já entraram.' : 'Bom descanso.') }));
  } else if (R.metaHoje == null) {
    H.replaceChildren(h('h2', { text: 'Hoje' }), h('div', { class: 'md-big' }, num(R.feitoHoje), h('small', { text: ' ganhos' })), h('div', { class: 'md-frase md-sub', text: 'Sem meta cadastrada pra ' + quem + ' neste mês.' }));
  } else {
    const falta = Math.max(0, R.metaHoje - R.feitoHoje);
    H.replaceChildren(h('h2', { text: 'Hoje' }),
      falta ? h('div', { class: 'md-big' }, num(falta), h('small', { text: falta === 1 ? ' ganho pra bater' : ' ganhos pra bater' }))
            : h('div', { class: 'md-big md-ok' }, num(R.feitoHoje), h('small', { text: ' de ' + num(R.metaHoje) })),
      h('div', { class: 'md-frase' }, falta ? ['Meta de hoje: ', h('b', { text: num(R.metaHoje) }), '. Já fez ', h('b', { text: num(R.feitoHoje) }), '.'] : h('span', { class: 'md-ok', text: 'Meta de hoje batida. Cada ganho a mais adianta a semana.' })),
      barra(R.feitoHoje, R.metaHoje));
  }

  // semana
  const faltaSem = R.metaSem ? Math.max(0, R.metaSem - R.feitoSem) : 0;
  $('c-semana').replaceChildren(h('h2', { text: 'Semana' }),
    h('div', { class: 'md-mid' }, num(R.feitoSem), R.metaSem ? h('small', { text: ' de ' + num(R.metaSem) }) : null),
    R.metaSem ? barra(R.feitoSem, R.metaSem) : null,
    h('div', { class: 'md-sub', text: dm(R.sem.semana_ini) + ' a ' + dm(R.sem.semana_fim) + (R.metaSem ? (faltaSem ? ' · faltam ' + num(faltaSem) + (R.restSem ? ' em ' + R.restSem + (R.restSem === 1 ? ' dia útil' : ' dias úteis') : ' · sem dias úteis restantes') : ' · semana batida') : '') }));

  // mês
  const T = R.T;
  $('c-mes').replaceChildren(h('h2', { text: 'Mês' }),
    h('div', { class: 'md-mid' }, num(T.feito), T.meta ? h('small', { text: ' de ' + num(T.meta) }) : null),
    T.meta ? barra(T.feito, T.meta) : null,
    h('div', { class: 'md-sub' }, T.meta ? [num(T.atingido_pct) + '% · ', h('span', { class: T.ritmo >= 0 ? 'md-pos' : 'md-neg', text: T.ritmo >= 0 ? (T.ritmo ? num(T.ritmo) + ' à frente' : 'no ritmo') : num(-T.ritmo) + ' atrás' })] : R.c0.nome_mes));

  // serviços
  $('c-servicos').replaceChildren(h('h2', { text: 'Por serviço no mês' }),
    R.servicos.length ? h('ul', { class: 'md-lista' }, R.servicos.sort((a, b) => (b.meta || 0) - (a.meta || 0) || b.feito - a.feito).map((r) => h('li', {}, h('span', { text: r.area }), h('b', { text: num(r.feito) + (r.meta ? ' / ' + num(r.meta) : '') }), r.meta ? barra(r.feito, r.meta) : null)))
      : h('div', { class: 'md-vazio', text: 'Nenhum ganho ainda neste mês.' }));

  // ranking
  const linhas = VENDEDORES.map((v) => { const r = painel.por_area.find((x) => x.mes === R.mes && x.vendedor === v && x.area === 'Total') || { feito: 0, meta: null }; return { v, feito: r.feito, meta: r.meta }; })
    .sort((a, b) => b.feito - a.feito);
  const maior = Math.max(1, ...linhas.map((l) => l.meta || l.feito));
  $('c-ranking').replaceChildren(h('h2', { text: 'Ranking do mês' }),
    h('ul', { class: 'md-lista md-rank' }, linhas.map((l, i) => h('li', { class: l.v === quem ? 'eu' : null }, h('span', { class: 'pos', text: (i + 1) + 'º' }), h('span', { text: l.v }), h('b', { text: num(l.feito) + (l.meta ? ' · ' + Math.round((l.feito / l.meta) * 100) + '%' : '') }), barra(l.feito, l.meta || maior)))));

  // tarefas
  const C = $('c-tarefas');
  if (tarefas && quem !== EQUIPE) {
    const agora = Date.now(), hoje = hojeIso();
    const dia = (ms) => { const d = new Date(ms); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
    let vencem = 0, atrasadas = 0;
    for (const [vi, , prazo, conc] of tarefas.tarefas) {
      if (conc || vendedorDe(tarefas.vendedores[vi]) !== quem) continue;
      const pz = prazo * 60000;
      if (pz < agora) atrasadas++; else if (dia(pz) === hoje) vencem++;
    }
    C.hidden = false;
    C.replaceChildren(h('h2', { text: 'Tarefas no Kommo' }), h('div', { class: 'md-tar' },
      h('a', { href: 'tarefas.html' }, h('b', { text: num(vencem) }), h('span', { text: 'ainda vencem hoje' })),
      h('a', { href: 'tarefas.html' }, h('b', { class: atrasadas ? 'md-neg' : 'md-ok', text: num(atrasadas) }), h('span', { text: 'atrasadas' }))));
  } else C.hidden = true;
};

const carregar = async () => {
  try {
    const r = await (await fetch(MR_API, { cache: 'no-store' })).json();
    if (!r.ok) throw new Error('erro');
    painel = montarPainel(r);
    const t = new Date(r.atualizado);
    $('atualizado').textContent = 'Números do Kommo de ' + pad2(t.getHours()) + ':' + pad2(t.getMinutes()) + ' · atualiza sozinho';
  } catch (e) {
    if (!painel) { $('aviso').hidden = false; $('aviso').textContent = 'Não consegui ler os números do Kommo agora. Tento de novo em 5 minutos.'; }
  }
  try { const t = await (await fetch(MR_API + '?aba=tarefas', { cache: 'no-store' })).json(); if (t.tarefas) tarefas = t; } catch (e) { /* tarefas são opcionais aqui */ }
  desenhar();
};
carregar();
setInterval(carregar, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) carregar(); });
</script>

</body>
